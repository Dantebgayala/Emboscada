<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Jogos</title>
<style>
body{margin:0;background:#171717;color:#eee;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.app{width:min(700px,92vw);text-align:center}.logo{font-size:40px;font-weight:900;letter-spacing:6px;margin-bottom:6px}.sub{color:#aaa;margin-bottom:28px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.game{background:#292929;border-radius:16px;padding:26px;box-shadow:0 8px 24px #0005}.icon{font-size:52px}.game h2{margin:12px 0 6px}.game p{color:#aaa;min-height:42px}.btn{display:inline-block;background:#e8b94d;color:#171717;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:9px;margin-top:10px}.footer{margin-top:25px;color:#777;font-size:13px}
</style>
</head>
<body><main class="app"><div class="logo">MEUS JOGOS</div><div class="sub">Escolha um jogo para começar</div><section class="games">
<div class="game"><div class="icon">⚔️</div><h2>EMBOSCADA</h2><p>Cerque as peças adversárias e capture 7.</p><a class="btn" href="/emboscada">JOGAR</a></div>
<div class="game"><div class="icon">🧩</div><h2>COMPLEXO</h2><p>Movimente, capture e alcance seu destino.</p><a class="btn" href="/complexo">JOGAR</a></div>
</section><div class="footer">Jogos para 2 jogadores online</div></main></body></html>
