<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMBOSCADA</title>
<style>body{margin:0;background:#171717;color:#eee;font-family:Arial;display:grid;place-items:center;min-height:100vh}.app{width:min(760px,94vw)}h1{text-align:center;letter-spacing:7px;margin:10px}.sub,.msg{text-align:center;color:#aaa}.controls,.top{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.card{background:#292929;padding:10px 14px;border-radius:9px}button,input{padding:10px;border:0;border-radius:8px}button{background:#e8b94d;font-weight:bold;cursor:pointer}.board{width:min(92vw,640px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:auto;border:7px solid #684527}.cell{border:0;padding:0;position:relative}.l{background:#ead8b8}.d{background:#895a3a}.piece{position:absolute;width:68%;aspect-ratio:1;left:16%;top:16%;border-radius:50%;box-shadow:0 3px 6px #0008}.w{background:#f8f8f4}.b{background:#151515;border:2px solid #555;box-sizing:border-box}.sel{outline:5px solid #e8b94d;outline-offset:-5px}.legal:after{content:"";position:absolute;width:20%;aspect-ratio:1;border-radius:50%;background:#4da95e;left:40%;top:40%}.msg{min-height:28px;color:#e8b94d;margin:14px}</style>
<div class="app"><h1>EMBOSCADA</h1><div class="sub">Cerque. Capture. Vença.</div><div class="controls"><button onclick="createRoom()">Criar sala</button><input id="code" maxlength="6" placeholder="CÓDIGO"><button onclick="joinRoom()">Entrar</button></div><div class="top"><div class="card">Sala: <b id="room">—</b></div><div class="card" id="you">Crie ou entre em uma sala</div><div class="card">⚪ <span id="ws">0</span>/7 · ⚫ <span id="bs">0</span>/7</div></div><div id="board" class="board"></div><div id="msg" class="msg"></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),N=8;let room,color,state,sel;
const $=x=>document.getElementById(x);function createRoom(){socket.emit("create")}function joinRoom(){socket.emit("join",$("code").value)}
socket.on("err",m=>message(m));socket.on("joined",d=>{room=d.room;color=d.color;state=d;$("room").textContent=room;$("you").textContent="Você joga de "+(color==="W"?"BRANCAS":"PRETAS");render()});socket.on("state",d=>{state=d;sel=null;render()});
function message(x){$("msg").textContent=x}function legal(a,b,r,c){return state.ready&&state.turn===color&&state.board[a][b]===color&&!state.board[r][c]&&Math.abs(a-r)===1&&Math.abs(b-c)===1}
function render(){if(!state)return;$("ws").textContent=state.score.W;$("bs").textContent=state.score.B;let z=$("board");z.innerHTML="";for(let r=0;r<N;r++)for(let c=0;c<N;c++){let x=document.createElement("button");x.className="cell "+((r+c)%2?"d":"l");if(sel&&sel[0]===r&&sel[1]===c)x.classList.add("sel");if(sel&&legal(sel[0],sel[1],r,c))x.classList.add("legal");if(state.board[r][c]){let p=document.createElement("div");p.className="piece "+(state.board[r][c]==="W"?"w":"b");x.append(p)}x.onclick=()=>click(r,c);z.append(x)}message(state.winner?"🏆 "+(state.winner===color?"Você venceu!":"Seu adversário venceu."):!state.ready?"Aguardando outro jogador...":state.turn===color?"Sua vez":"Vez do adversário")}
function click(r,c){if(!state||state.winner||!state.ready||state.turn!==color)return;if(sel&&legal(sel[0],sel[1],r,c)){socket.emit("move",{room,r1:sel[0],c1:sel[1],r2:r,c2:c});return}if(state.board[r][c]===color){sel=[r,c];render()}}
</script>
